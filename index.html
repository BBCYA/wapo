/* V1.3.1: iPhone-friendly date selectors instead of native input[type=date]. */
.date-range-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.date-fieldset{border:1px solid #dfe6f0;border-radius:13px;padding:11px 10px 12px;min-width:0;margin:0;background:#fcfdff}
.date-fieldset legend{font-size:12px;font-weight:850;color:#486286;padding:0 5px}
.date-selects{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);gap:5px}
.date-selects select{appearance:auto;-webkit-appearance:menulist;width:100%;min-width:0;height:46px;border:1px solid #d7e1ef;border-radius:9px;background:#fff;font-size:16px;color:#182542;padding:4px 2px;text-align:center;text-align-last:center}

/* V1.3.2 : click-to-open compact calendar picker; works on touch and desktop. */
.date-range-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.date-fieldset{position:relative;border:0;border-radius:0;padding:0;min-width:0;margin:0;background:transparent;overflow:visible}
.date-fieldset legend{font-size:12px;font-weight:850;color:#486286;padding:0;margin:0 0 7px}
.date-trigger{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:49px;padding:10px 13px;border:1px solid #d7e1ef;background:#fff;color:#253751;border-radius:11px;font-size:15px;font-weight:800;white-space:nowrap;text-align:left}
.date-trigger:hover{border-color:#8aaef4;background:#f7faff}
.date-trigger[aria-expanded="true"]{border-color:#3567e8;box-shadow:0 0 0 3px #dfeaff}
.date-trigger .calendar-ico{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#eaf0ff;color:#3567e8;font-size:19px;flex-shrink:0}
.date-popover{position:absolute;z-index:24;left:0;top:calc(100% + 9px);width:min(315px,calc(100vw - 36px));border:1px solid #dce5f5;background:#fff;border-radius:16px;padding:13px;box-shadow:0 16px 42px #233d7135}
.date-fieldset.date-to .date-popover{left:auto;right:0}
.picker-heading{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:12px}
.picker-heading strong{font-size:15px;font-weight:850;white-space:nowrap}
.picker-nav{width:38px;height:38px;border-radius:10px;background:#f4f7fe;border:0;color:#355aa0;font-size:22px;font-weight:700;display:grid;place-items:center}
.picker-nav:hover{background:#e9f0ff}
.picker-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.picker-weekday{text-align:center;padding:8px 0;color:#8492a8;font-size:11px;font-weight:800}
.picker-weekday.is-weekend{color:#d85c72}
.picker-empty{height:37px}
.picker-date{min-height:37px;border:1px solid transparent;border-radius:9px;background:#fff;color:#273952;font-weight:700;font-size:13px;padding:0;display:grid;place-items:center;touch-action:manipulation}
.picker-date:hover,.picker-date:focus-visible{background:#eaf1ff;border-color:#b6ccff}
.picker-date.is-picked{background:#3567e8;color:white;border-color:#3567e8}
.picker-date.is-in-range:not(.is-picked){background:#edf3ff;color:#2450a7}
.picker-date.is-weekend:not(.is-picked){color:#d85c72}
.picker-date.is-today:not(.is-picked){border-color:#8daefa}
.picker-actions{display:flex;justify-content:space-between;align-items:center;gap:6px;border-top:1px solid #edf1f7;margin-top:11px;padding-top:9px}
.picker-actions .btn{padding:8px 9px;font-size:12px}
.picker-help{font-size:10px;color:#8998ae}
.date-picker-shade{display:none}
@media(max-width:650px){
 .date-range-grid{grid-template-columns:1fr;gap:11px}
 .date-trigger{height:50px;font-size:16px}
 .date-picker-shade{display:block;position:fixed;inset:0;background:#0b1a3470;z-index:29}
 .date-popover{position:fixed;z-index:30;left:50%!important;right:auto!important;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100vw - 32px));max-height:calc(100dvh - 44px);overflow-y:auto;padding:16px;box-shadow:0 22px 60px #13254055}

<body>
<div id="app"><div class="site-header"><div class="site-header-inner"><div class="site-logo"><span class="site-logo-mark"><svg class="microwave-icon" viewBox="0 0 32 32" width="25" height="25" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="26" height="20" rx="3"/><rect x="6.5" y="9.5" width="15" height="12.5" rx="1.5"/><path d="M22.5 8.5v15M6.5 26v1.5M26 26v1.5"/><circle cx="25.7" cy="12.5" r="1.45"/><circle cx="25.7" cy="19" r="1.45"/><path d="M9 15c1-1.5 2.2-1.5 3.2 0s2.2 1.5 3.2 0" stroke-width="1.6"/></svg></span><span>微波</span></div><span class="site-caption">載入試用介面中…</span></div></div><main class="app"><section class="hero"><div><div class="kicker">TEAM LEAVE CALENDAR</div><h1>月休安排，打開就查得到。</h1><p>手機、平板及電腦都能查看的組內月休試用網站。</p></div></section><div class="notice">如果畫面始終停留在這裡，代表目前開啟檔案的預覽器沒有執行 JavaScript。請使用 Safari 或其他完整瀏覽器開啟託管的網站網址。</div><section class="section" style="margin-top:14px"><h2 class="section-title">網站分頁</h2><p class="sub">首頁／個人月休／全組日曆／橫向總表／更多功能</p><p class="sub">24 位人員名單已加入；排班及餘額為虛構示範資料。</p></section></main></div>
<script>
(function(){'use strict';
const PEOPLE=['惠淇','于華','岳得','鈺霖','家賢','博宇','文郁','永澤','延鴻','紘旻','怡佩','嘉育','佑昌','博程','瑞豪','煒弘','孟唐','勤堯','士閎','逸宸','治學','紘銘','曜誠','冠妤'];
const STATUSES=['例','榮','補','半補','公','勤務','受訓','傳真','留停','洽公','值星'];
const TYPES=['積假','榮譽','慰休'];
const HALF={'半補':0.5};
const KEY='team-leave-v13-local-demo';
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
let state={tab:'personal',year:2026,month:10,day:22,person:14,memberSearch:'',chosen:new Set([13,14]),from:'2026-10-22',to:'2026-10-25',batchStatus:'勤務',review:false,reviewRecords:null,admin:false,loginOpen:false,loginError:'',adminSection:'batch',balancePerson:14,balanceType:'積假',balanceTarget:'',balanceReason:'',adjustPreview:false,ruleStatus:'補',ruleTarget:'',ruleUnit:'1',...saved.ui};state.person=null;state.chosen=new Set(saved.ui&&saved.ui.chosen||[13,14]);state.admin=false;state.menuOpen=false;state.pickerOpen=null;state.pickerYear=2026;state.pickerMonth=10;state.tab=(["home","personal","group","matrix","more"].includes(location.hash.slice(1))?location.hash.slice(1):"home");
let data={overrides:saved.overrides||{},rules:saved.rules||{},accounts:saved.accounts||{},audits:saved.audits||[]};
function acct(i){if(!data.accounts[i])data.accounts[i]={base:{'積假':8+i%6,'榮譽':2+i%3,'慰休':5+i%4},added:{'積假':0,'榮譽':0,'慰休':0},adjust:{'積假':0,'榮譽':0,'慰休':0}};return data.accounts[i]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({ui:{year:state.year,month:state.month,day:state.day,chosen:[...state.chosen],from:state.from,to:state.to,batchStatus:state.batchStatus,balancePerson:state.balancePerson},overrides:data.overrides,rules:data.rules,accounts:data.accounts,audits:data.audits}))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pad(n){return String(n).padStart(2,'0')};function dateStr(y,m,d){return `${y}-${pad(m)}-${pad(d)}`};function days(y,m){return new Date(y,m,0).getDate()};function dayLabel(d){return ['日','一','二','三','四','五','六'][new Date(d+'T12:00:00').getDay()]};function fullDate(d){return `${Number(d.slice(5,7))} 月 ${Number(d.slice(8))} 日（${dayLabel(d)}）`}
function demoCode(i,key){if(!key.startsWith('2026-10'))return '';let d=Number(key.slice(-2)),x=(i*13+d*9)%37;if((i+d)%23===0)return '例';if(x===1)return '榮';if(x===2||x===3)return '補';if(x===4)return '半補';if(x===5)return '公';if(x===6||x===7||x===8)return '勤務';if(x===9)return '受訓';if(x===10)return '傳真';if(x===11)return '留停';if(x===12)return '洽公';if(x===13)return '值星';return ''}
function code(i,key){const k=`${key}|${i}`;return Object.prototype.hasOwnProperty.call(data.overrides,k)?data.overrides[k]:demoCode(i,key)}
function allDataDays(){let daysArr=[];for(let d=1;d<=31;d++)daysArr.push(dateStr(2026,10,d));for(let k of Object.keys(data.overrides)){const dt=k.split('|')[0];if(!daysArr.includes(dt))daysArr.push(dt)}return daysArr}
function deducted(i,type){let n=0;for(const dt of allDataDays()){let st=code(i,dt),rule=data.rules[st];if(rule&&rule.target===type)n+=Number(rule.unit)||0}return n}
function balance(i,type){const a=acct(i);return +(Number(a.base[type]||0)+Number(a.added[type]||0)-deducted(i,type)+Number(a.adjust[type]||0)).toFixed(2)}
function fmt(n){return Number.isInteger(n)?String(n):n.toFixed(1)}
function rowStatus(status){return status?`<span class="tag c-${esc(status)}">${esc(status)}</span>`:`<span style="color:#c0c8d5">—</span>`}
function monthNav(){return `<div class="monthnav"><button data-act="prev" aria-label="上個月">‹</button><b>${state.year} 年 ${state.month} 月</b><button data-act="next" aria-label="下個月">›</button></div>`}
const ROUTES=[['home','首頁'],['personal','個人月休'],['group','全組日曆'],['matrix','橫向總表'],['more','更多功能']];
function routeOk(v){return ROUTES.some(x=>x[0]===v)||(v==='admin'&&state.admin)}
function pageButton(id,label,mobile=false){const active=state.tab===id;return `<a href="#${id}" data-act="tab" data-val="${id}" class="${mobile?'menu-link':'site-link'} ${active?'is-current':''}" ${active?'aria-current="page"':''}>${label}${mobile?'<span aria-hidden="true">›</span>':''}</a>`}
function nav(){const routes=[...ROUTES];if(state.admin)routes.push(['admin','管理後台']);return `<header class="site-header"><div class="site-header-inner"><a class="site-logo" href="#home" data-act="tab" data-val="home" aria-label="微波首頁"><span class="site-logo-mark"><svg class="microwave-icon" viewBox="0 0 32 32" width="25" height="25" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="26" height="20" rx="3"/><rect x="6.5" y="9.5" width="15" height="12.5" rx="1.5"/><path d="M22.5 8.5v15M6.5 26v1.5M26 26v1.5"/><circle cx="25.7" cy="12.5" r="1.45"/><circle cx="25.7" cy="19" r="1.45"/><path d="M9 15c1-1.5 2.2-1.5 3.2 0s2.2 1.5 3.2 0" stroke-width="1.6"/></svg></span><span>微波</span></a><nav class="site-links" aria-label="網站主選單">${routes.map(([id,label])=>pageButton(id,label)).join('')}</nav><div class="site-actions">${state.admin?`<button type="button" class="admin-action" data-act="logout" title="登出管理員" aria-label="登出管理員"><span class="action-symbol" aria-hidden="true">↪</span><span class="action-text">登出</span></button>`:`<button type="button" class="admin-action" data-act="login" title="管理員登入" aria-label="管理員登入"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span class="action-text">登入</span></button>`}<button class="menu-trigger" data-act="menu-toggle" aria-expanded="${!!state.menuOpen}" aria-controls="mobile-site-menu" aria-label="${state.menuOpen?'關閉':'開啟'}網站選單"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">${state.menuOpen?'<path d="M5 5l14 14M19 5L5 19"/>':'<path d="M4 7h16M4 12h16M4 17h16"/>'}</svg></button></div></div>${state.menuOpen?`<nav class="mobile-menu" id="mobile-site-menu" aria-label="手機網站選單"><div class="mobile-menu-inner">${routes.map(([id,label])=>pageButton(id,label,true)).join('')}<div class="menu-note">可隨時從這裡切換分頁，後續也能擴充其他功能。</div></div></nav>`:''}</header>${state.menuOpen?'<button type="button" class="mobile-menu-backdrop" aria-label="關閉選單" data-act="menu-close"></button>':''}`}
function top(){return state.tab==='home'?`<section class="hero home-hero"><div><div class="kicker">TEAM LEAVE CALENDAR</div><h1>月休安排，打開就查得到。</h1><p>查自己的月休，或查看今天誰在勤務、誰休假。無須登入就能查詢。</p><div class="hero-buttons"><button class="hero-action" data-act="tab" data-val="personal">查詢個人月休 ↗</button><button class="hero-action outline" data-act="tab" data-val="group">查看全組日曆</button></div></div><div class="hero-side"><b>24</b><span>位組員</span></div></section>`:`<div class="page-heading"><div><span class="page-eyebrow">TEAM LEAVE</span><h1>${({'personal':'個人月休','group':'全組日曆','matrix':'橫向總表','more':'更多功能','admin':'管理後台'})[state.tab]||'微波'}</h1><p>2026 微波 · 月休查詢示範版</p></div><span class="page-version">V1.5 試用版</span></div>`}
function banner(){return `<div class="notice demo-notice">示範資料：名單共 24 位；所有排班與剩餘額度為虛構數值。留守統計規則尚待確認，本站不會自行推算。資料僅存於本機瀏覽器。</div>`}
function home(){const dt=dateStr(state.year,state.month,state.day),counts={};for(let i=0;i<PEOPLE.length;i++){const s=code(i,dt);counts[s]=(counts[s]||0)+1}const leave=['例','榮','補','半補'].reduce((sum,s)=>sum+(counts[s]||0),0);return `<div class="home-welcome"><div class="home-lead"><span class="page-eyebrow">QUICK ACCESS</span><h2>今天想查什麼？</h2><p class="sub">一個入口，快速切換個人、全組及完整月休總表。</p></div><div class="home-cards"><button class="home-card" data-act="tab" data-val="personal"><span class="home-card-icon home-card-blue">◷</span><strong>個人月休</strong><small>選姓名，查自己的每日狀態與剩餘假期</small><span class="home-card-arrow">查看 →</span></button><button class="home-card" data-act="tab" data-val="group"><span class="home-card-icon home-card-teal">▦</span><strong>全組日曆</strong><small>點日期查看當天各狀態的人員名單</small><span class="home-card-arrow">查看 →</span></button><button class="home-card" data-act="tab" data-val="matrix"><span class="home-card-icon home-card-purple">▤</span><strong>橫向總表</strong><small>瀏覽完整月份及三種假期剩餘額度</small><span class="home-card-arrow">查看 →</span></button><button class="home-card" data-act="tab" data-val="more"><span class="home-card-icon home-card-slate">＋</span><strong>更多功能</strong><small>保留擴充頁面，以後可加入其他查詢工具</small><span class="home-card-arrow">查看 →</span></button></div><section class="home-status section"><div class="row between wrap"><div><h2 class="section-title">本月日期快覽</h2><p class="sub">${fullDate(dt)} · 此處僅顯示示範統計</p></div><button class="btn" data-act="tab" data-val="group">開啟全組日曆 →</button></div><div class="stats"><div class="stat pink"><div class="stat-label">假別標記</div><div class="stat-value">${leave}</div><div class="stat-help">例／榮／補／半補</div></div><div class="stat blue"><div class="stat-label">勤務標記</div><div class="stat-value">${counts['勤務']||0}</div><div class="stat-help">非留守人數</div></div><div class="stat violet"><div class="stat-label">受訓標記</div><div class="stat-value">${counts['受訓']||0}</div><div class="stat-help">未套用正式資料</div></div></div></section></div>`}
function more(){return `<section class="section more-section"><span class="page-eyebrow">COMING SOON</span><h2 class="section-title" style="font-size:22px;margin-top:7px">預留未來的分頁</h2><p class="sub">上方選單的「更多功能」已經是一個獨立頁面。之後有新需求，只需新增分頁與對應畫面，不必重做整個月休網站。</p><div class="more-grid"><div class="future-card"><span>▣</span><b>公告資訊</b><p>有需要時再加入，現在未啟用。</p></div><div class="future-card"><span>◴</span><b>重要日期</b><p>可預留給未來事件或日程查詢。</p></div><div class="future-card"><span>＋</span><b>自訂新分頁</b><p>依組內需要增設，不預先限制功能。</p></div></div><button class="btn btn-primary" data-act="tab" data-val="home" style="margin-top:20px">回首頁</button></section>`}
function dateGrid(personal){const blanks=new Date(state.year,state.month-1,1).getDay(),n=days(state.year,state.month);let count=Math.ceil((blanks+n)/7)*7;let arr=[];for(let a=0;a<count;a++){const d=a-blanks+1;if(d<1||d>n){arr.push('<div class="date-empty"></div>');continue;}const dt=dateStr(state.year,state.month,d),weekend=[0,6].includes(new Date(state.year,state.month-1,d).getDay());let inner=personal?rowStatus(code(state.person,dt)):(()=>{let ss=PEOPLE.map((_,i)=>code(i,dt));let leave=ss.filter(x=>['例','榮','補','半補'].includes(x)).length,work=ss.filter(x=>x==='勤務').length,training=ss.filter(x=>x==='受訓').length;return `<div class="mini-count"><b>假別 ${leave}</b></div><div class="mini-count">勤務 ${work}${training?' · 訓 '+training:''}</div>`})();arr.push(`<button class="date ${state.day===d?'selected':''} ${weekend?'weekend':''}" data-act="day" data-val="${d}"><span class="number">${d}</span>${inner}</button>`)}return `<div class="calendar-head">${['日','一','二','三','四','五','六'].map(x=>`<span>${x}</span>`).join('')}</div><div class="calendar">${arr.join('')}</div>`}
function personal(){
 const i=state.person;
 const picker=`<div class="section"><div class="row between wrap"><div><h2 class="section-title">個人月休查詢</h2><p class="sub">請先選擇姓名，再查看該人員的月休及剩餘額度。</p></div></div><div class="controls"><div class="ctrl" style="flex:1 1 180px"><label for="person-select">查詢人員</label><select id="person-select" data-change="person" aria-label="選擇查詢人員"><option value="" ${i===null?'selected':''}>— 請選擇姓名 —</option>${PEOPLE.map((p,n)=>`<option value="${n}" ${i===n?'selected':''}>${p}</option>`).join('')}</select></div><div class="ctrl"><label>年份 / 月份</label>${monthNav()}</div></div>`;
 if(i===null){return picker+`<div class="person-empty" role="status"><div class="person-empty-icon" aria-hidden="true">◷</div><strong>尚未選擇人員</strong><p>從上方選擇姓名後，就會顯示個人月曆、假別、勤務及假期餘額。</p></div></div>`;}
 const dt=dateStr(state.year,state.month,state.day),counts={};
 for(let d=1;d<=days(state.year,state.month);d++){let s=code(i,dateStr(state.year,state.month,d));if(s)counts[s]=(counts[s]||0)+1;}
 const dayStatus=code(i,dt);
 return picker+`<div class="stats"><div class="stat pink"><div class="stat-label">假別標記次數</div><div class="stat-value">${['例','榮','補','半補'].reduce((a,k)=>a+(counts[k]||0),0)}</div><div class="stat-help">非正式扣假統計</div></div><div class="stat blue"><div class="stat-label">勤務天數</div><div class="stat-value">${counts['勤務']||0}</div><div class="stat-help">按標記天數統計</div></div><div class="stat violet"><div class="stat-label">受訓天數</div><div class="stat-value">${counts['受訓']||0}</div><div class="stat-help">按標記天數統計</div></div></div><div class="legend">${STATUSES.map(s=>`<span class="key"><span class="dot c-${s}"></span>${s}</span>`).join('')}</div>${dateGrid(true)}<div class="selected-info"><div class="row between"><b>${fullDate(dt)}</b>${rowStatus(dayStatus)}</div><p class="sub">${PEOPLE[i]}：${dayStatus?`當日標記「${dayStatus}」`:'當日尚無紀錄'}。</p></div><div class="divider"></div><b style="font-size:13px">我的剩餘額度 <span class="badge warnbadge">示範數字</span></b><div class="stats">${TYPES.map(t=>`<div class="stat"><div class="stat-label">${t}</div><div class="stat-value" style="font-size:21px">${fmt(balance(i,t))}</div><div class="stat-help">天・規則待確認</div></div>`).join('')}</div></div>`;
}
function groupSections(day){const date=dateStr(state.year,state.month,day);const groups=[['例、榮、補、半補',['例','榮','補','半補']],['勤務',['勤務']],['受訓／傳真／公／洽公／值星／留停',['受訓','傳真','公','洽公','值星','留停']],['未標記',['']]];return groups.map(([title,types])=>{const members=PEOPLE.map((p,i)=>({p,s:code(i,date)})).filter(x=>types.includes(x.s));return `<div class="group-section"><div class="group-caption">${title}<small>${members.length} 人</small></div><div class="group-wrap">${members.length?members.map(x=>`<span class="namepill">${x.p} ${x.s&&types.length>1?`<span class="tag c-${x.s}">${x.s}</span>`:''}</span>`).join(''):'<span class="sub">無人員</span>'}</div></div>`}).join('')}
function group(){return `<div class="result-grid"><section class="section"><div class="row between wrap"><div><h2 class="section-title">全組日曆</h2><p class="sub">點選某一天，就能查看各個狀態的人員名單。</p></div></div><div class="controls"><div class="ctrl"><label>顯示月份</label>${monthNav()}</div></div><div class="legend"><span class="key"><span class="dot c-例"></span>例／榮／補／半補</span><span class="key"><span class="dot c-勤務"></span>勤務</span><span class="key"><span class="dot c-受訓"></span>受訓</span></div>${dateGrid(false)}<p class="sub">「假別」只表示當日有休假類型標記的人數，並非正式扣假或留守統計。</p></section><aside class="section inspector" id="day-info"><h2 class="section-title">${fullDate(dateStr(state.year,state.month,state.day))}</h2><p class="sub">當天全組狀態（虛構資料）</p>${groupSections(state.day)}<div class="notice" style="margin-top:10px">留守是你將另行定義的統計概念，這版不顯示也不讓管理員勾選留守。</div></aside></div>`}
function matrix(){let n=days(state.year,state.month);return `<section class="section"><div class="row between wrap"><div><h2 class="section-title">橫向月休總表</h2><p class="sub">保留 Excel 總表的查看方式；右側新增剩餘積假、榮譽、慰休。</p></div></div><div class="controls"><div class="ctrl"><label>顯示月份</label>${monthNav()}</div></div><div class="matrix-help"><span class="matrix-tip">← 左右滑動，姓名欄會固定在左側。最右邊是餘額統計。</span><div class="row" style="gap:6px"><button class="btn" data-act="matrix-start">跳到月初</button><button class="btn btn-primary" data-act="matrix-end">查看右側餘額 →</button></div></div><div class="matrix-scroller" id="matrix-scroller"><table class="matrix"><thead><tr><th class="sticky-name">姓名</th>${Array.from({length:n},(_,j)=>{let d=j+1,w=new Date(state.year,state.month-1,d).getDay();return `<th class="${[0,6].includes(w)?'weekend':''}">${d}<br><small>${['日','一','二','三','四','五','六'][w]}</small></th>`}).join('')}${TYPES.map(t=>`<th class="balancecell balance-head">剩餘<br>${t}</th>`).join('')}</tr></thead><tbody>${PEOPLE.map((p,i)=>`<tr><td class="sticky-name">${p}</td>${Array.from({length:n},(_,j)=>`<td>${rowStatus(code(i,dateStr(state.year,state.month,j+1)))}</td>`).join('')}${TYPES.map(t=>`<td class="balancecell">${fmt(balance(i,t))}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="sub">右側額度均為測試數據。管理員可設定起始額度、新增額度、扣假對應規則及人工修正。實際扣假規則仍未確認。</p></section>`}
function loginModal(){return `<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="管理員試用登入"><div class="row between"><h2>管理員試用登入</h2><button class="btn" data-act="close-login">關閉</button></div><p class="sub">僅供介面測試。正式版會由伺服器驗證，這版登入並不構成真正的安全保護。</p><div class="notice">測試帳號：<b>admin</b>　測試密碼：<b>demo2026</b></div><form id="login-form"><div class="ctrl"><label>帳號</label><input name="loginUser" autocomplete="username" required placeholder="admin"></div><div class="ctrl"><label>密碼</label><input name="loginPass" type="password" autocomplete="current-password" required placeholder="demo2026"></div>${state.loginError?`<p style="color:#bf4657;font-size:12px">${esc(state.loginError)}</p>`:''}<button class="btn btn-primary" style="width:100%;margin-top:12px">登入管理員試用模式</button></form></div></div>`}
function adminTabs(){return `<div class="row wrap" style="gap:6px;margin-bottom:15px">${[['batch','多人批次設定'],['balance','假期餘額管理'],['rules','自動扣假規則'],['audit','修改紀錄']].map(([id,text])=>`<button class="btn ${state.adminSection===id?'btn-primary':''}" data-act="admin-section" data-val="${id}">${text}</button>`).join('')}</div>`}
function batchPreview(){if(!state.review)return '';let rec=state.reviewRecords||[];let changes=rec.filter(x=>x.prev!==x.next);let conflicts=changes.filter(x=>x.prev);return `<div class="preview" style="margin-top:12px"><b>即將更新 ${changes.length} 筆人員日期紀錄</b><br>人員：${state.chosen.size} 位；範圍：${esc(state.from)} ～ ${esc(state.to)}<br>狀態：<b>${esc(state.batchStatus||'清除狀態')}</b><br>其中 ${conflicts.length} 筆已有不同狀態，套用時會覆蓋。<div style="margin-top:10px"><button class="btn btn-primary" data-act="batch-apply" ${changes.length?'':'disabled'}>確認套用 ${changes.length} 筆</button> <button class="btn" data-act="batch-cancel">取消</button></div><p class="sub">這版只會更新目前瀏覽器裡的模擬資料。</p></div>`}
function datePickerPopup(field){
 const monthDate=new Date(state.pickerYear,state.pickerMonth-1,1),y=monthDate.getFullYear(),m=monthDate.getMonth()+1;
 const blanks=monthDate.getDay(),n=days(y,m);
 const today=new Date(),todayKey=dateStr(today.getFullYear(),today.getMonth()+1,today.getDate());
 let grid=['日','一','二','三','四','五','六'].map((d,i)=>`<span class="picker-weekday ${i===0||i===6?'is-weekend':''}">${d}</span>`).join('');
 grid+=Array.from({length:blanks},()=>'<span class="picker-empty"></span>').join('');
 for(let d=1;d<=n;d++){
  const key=dateStr(y,m,d),week=new Date(y,m-1,d).getDay();
  const selected=key===state[field],between=key>=state.from&&key<=state.to;
  grid+=`<button type="button" role="gridcell" class="picker-date ${selected?'is-picked':''} ${between?'is-in-range':''} ${week===0||week===6?'is-weekend':''} ${key===todayKey?'is-today':''}" data-act="picker-day" data-val="${key}" aria-label="${y}年${m}月${d}日" aria-selected="${selected}">${d}</button>`;
 }
 return `<div class="date-popover" role="dialog" aria-label="${field==='from'?'開始':'結束'}日期月曆"><div class="picker-heading"><button type="button" class="picker-nav" data-act="picker-nav" data-val="-1" aria-label="上個月">‹</button><strong>${y} 年 ${m} 月</strong><button type="button" class="picker-nav" data-act="picker-nav" data-val="1" aria-label="下個月">›</button></div><div class="picker-grid" role="grid">${grid}</div><div class="picker-actions"><button class="btn" type="button" data-act="picker-today">跳到今天</button><span class="picker-help">點選日期即完成</span><button class="btn" type="button" data-act="picker-close">關閉</button></div></div>`;
}
function dateControls(field,label){
 const value=state[field],parts=value.split('-').map(Number),open=state.pickerOpen===field;
 return `<fieldset class="date-fieldset ${field==='to'?'date-to':''}"><legend>${label}</legend><button type="button" class="date-trigger" data-act="picker-toggle" data-val="${field}" aria-expanded="${open}" aria-label="${label}：${parts[0]}年${parts[1]}月${parts[2]}日，點選開啟日曆"><span>${parts[0]} 年 ${parts[1]} 月 ${parts[2]} 日</span><span class="calendar-ico" aria-hidden="true">▦</span></button>${open?datePickerPopup(field):''}</fieldset>`;
}
function dateIsValidRange(){return !!parseDate(state.from)&&!!parseDate(state.to)&&state.from<=state.to}
function batch(){return `<div class="admin-layout"><section class="section"><h2 class="section-title">多人批次設定</h2><p class="sub">一次選多位人員、指定起迄日期與狀態，先預覽再套用。</p><div class="divider"></div><div class="row between wrap"><label class="field-label">選擇人員（已選 ${state.chosen.size}/24）</label><div class="row" style="gap:5px"><button class="btn" data-act="select-all">全選</button><button class="btn" data-act="select-none">清空</button></div></div><div class="ctrl" style="margin:8px 0"><input id="name-search" placeholder="搜尋組員姓名…" value="${esc(state.memberSearch)}"></div><div class="members">${PEOPLE.map((p,i)=>`<label class="membercheck" data-name="${p}" ${p.includes(state.memberSearch)?'':'style="display:none"'}><input type="checkbox" data-member="${i}" ${state.chosen.has(i)?'checked':''}><span>${p}</span></label>`).join('')}</div><div class="divider"></div><div class="date-range-grid">${dateControls('from','開始日期')}${dateControls('to','結束日期')}</div>${state.pickerOpen?'<div class="date-picker-shade" data-act="picker-close" aria-hidden="true"></div>':''}<div class="date-helpers"><button type="button" class="btn" data-act="quick-range" data-val="current">本月整月</button><button type="button" class="btn" data-act="quick-range" data-val="next">下個月整月</button></div>${dateIsValidRange()?'':'<div class="date-range-error" role="alert">結束日期不可早於開始日期，請重新選擇。</div>'}<div class="ctrl" style="margin-top:11px"><label>套用狀態</label><select data-change="batch-status"><option value="">清除狀態（留空）</option>${STATUSES.map(s=>`<option value="${s}" ${state.batchStatus===s?'selected':''}>${s}</option>`).join('')}</select></div><button class="btn btn-primary" style="margin-top:14px;width:100%" data-act="batch-preview" ${(state.chosen.size&&dateIsValidRange())?'':'disabled'}>預覽批次修改</button>${batchPreview()}</section><aside class="section"><h2 class="section-title">怎麼使用？</h2><p class="sub">例如選取「瑞豪、博程、嘉育」，設定 10/22～10/25 為「勤務」，系統會一次修改這三人共 12 筆紀錄。</p><div class="selected-info"><b>支援的功能</b><p class="sub">✓ 多選、全選、取消選擇<br>✓ 連續日期、跨月份<br>✓ 顯示原有狀態的衝突數<br>✓ 確認後才修改<br>✓ 記錄修改時間與範圍</p></div><div class="notice">注意：「留守」不是狀態選項，也不提供留守勾選功能。</div></aside></div>`}
function balanceSection(){const i=state.balancePerson,a=acct(i),t=state.balanceType,now=balance(i,t);return `<div class="admin-layout"><section class="section"><h2 class="section-title">假期餘額管理</h2><p class="sub">計算式：初始額度 ＋ 新增額度 − 自動扣除 ＋ 人工修正。</p><div class="controls"><div class="ctrl" style="flex:1"><label>選擇人員</label><select data-change="balance-person">${PEOPLE.map((p,j)=>`<option value="${j}" ${i===j?'selected':''}>${p}</option>`).join('')}</select></div></div><div class="balance-grid">${TYPES.map(x=>`<div class="balance-item"><label>${x}</label><b style="font-size:22px">${fmt(balance(i,x))}</b><div class="sub">示範剩餘天數</div></div>`).join('')}</div><div class="divider"></div><b style="font-size:13px">設定初始額度與新增額度</b><p class="sub">這兩種額度變動須輸入修改原因，會保留紀錄。</p><div class="balance-grid">${TYPES.map(x=>`<div class="balance-item"><label>${x}</label><div class="field-label">起始</div><input inputmode="decimal" type="number" step="0.5" id="base-${x}" value="${a.base[x]}"><div class="field-label" style="margin-top:7px">新增</div><input inputmode="decimal" type="number" step="0.5" id="added-${x}" value="${a.added[x]}"></div>`).join('')}</div><div class="ctrl" style="margin-top:12px"><label>修改原因（必填）</label><input id="baseline-reason" placeholder="例如：依最新紙本餘額調整"></div><button class="btn btn-primary" data-act="save-baseline" style="margin-top:10px">儲存額度設定</button></section><aside class="section"><h2 class="section-title">手動修正剩餘額度</h2><p class="sub">例如原本顯示 8 天，人工確認應為 9 天，可直接輸入 9。之後仍持續自動計算。</p><div class="ctrl" style="margin-top:14px"><label>修正種類</label><select data-change="balance-type">${TYPES.map(x=>`<option value="${x}" ${t===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="preview" style="margin:12px 0">目前剩餘：<strong>${fmt(now)} 天</strong><br>自動扣除：<strong>${fmt(deducted(i,t))} 天</strong><br>人工修正累計：<strong>${fmt(a.adjust[t])} 天</strong></div><div class="ctrl"><label>正確的剩餘天數</label><input id="balance-target" inputmode="decimal" type="number" step="0.5" value="${esc(state.balanceTarget)}" placeholder="輸入調整後的天數"></div><div class="ctrl" style="margin-top:10px"><label>修正原因（必填）</label><textarea id="balance-reason" placeholder="例如：與最新核定紀錄核對後修正">${esc(state.balanceReason)}</textarea></div><button class="btn btn-primary" style="margin-top:12px;width:100%" data-act="balance-correct">確認手動修正</button><p class="sub">修改會記錄前後數值、時間和原因，且不會停用自動計算。</p></aside></div>`}
function rules(){return `<section class="section"><h2 class="section-title">自動扣假規則（先由你確認）</h2><p class="sub">你還沒指定「例、榮、補、半補」分別扣除哪種假，所以預設<strong>不自動扣除</strong>。這裡只是示範未來設定方式，不代表任何正式規定。</p><div class="notice">請務必在取得實際規則後才設定；沒有設定的假別不會推測扣除哪個餘額。</div><div style="overflow:auto;margin-top:15px"><table class="matrix" style="width:100%"><thead><tr><th>假別</th><th>扣除餘額</th><th>每次扣除（天）</th><th>操作</th></tr></thead><tbody>${['例','榮','補','半補','公','勤務','受訓','傳真','留停','洽公','值星'].map(s=>{let r=data.rules[s]||{target:'',unit:s==='半補'?0.5:1};return `<tr><td><b>${s}</b></td><td><select class="entry" data-rule-target="${s}" style="min-width:98px"><option value="" ${r.target===''?'selected':''}>不扣／待定</option>${TYPES.map(t=>`<option value="${t}" ${r.target===t?'selected':''}>${t}</option>`).join('')}</select></td><td><input data-rule-unit="${s}" type="number" min="0" max="31" step="0.5" class="entry" value="${r.unit}" style="min-width:78px;width:85px"></td><td><button class="btn" data-act="rule-save" data-val="${s}">儲存</button></td></tr>`}).join('')}</tbody></table></div><p class="sub">更改規則後，橫向總表與個人頁面的三種剩餘天數會重新計算；管理員修正值會被保留。</p></section>`}
function audit(){return `<section class="section"><div class="row between wrap"><h2 class="section-title">管理員修改紀錄（本機測試）</h2><button class="btn btn-danger" data-act="reset-demo">重設全部示範修改</button></div><p class="sub">只記錄這個試用版在目前瀏覽器裡的操作，不是可供稽核的正式伺服器紀錄。</p><div class="audit-list" style="margin-top:13px">${data.audits.length?data.audits.slice().reverse().map(a=>`<div class="audit"><b>${esc(a.action)}</b><br>${esc(a.detail)}<br><span>${esc(a.time)}</span></div>`).join(''):'<div class="sub">目前尚無修改紀錄。</div>'}</div></section>`}
function admin(){if(!state.admin)return `<section class="section"><h2>需要管理員登入</h2><button class="btn btn-primary" data-act="login">開啟登入</button></section>`;return `<div class="row between wrap" style="margin-bottom:10px"><div><h2 style="font-size:20px;margin:0">管理後台 <span class="badge warnbadge">模擬操作</span></h2><p class="sub">這裡才看得到修改選項；一般組員的頁面沒有這些功能。</p></div></div>${adminTabs()}${state.adminSection==='batch'?batch():state.adminSection==='balance'?balanceSection():state.adminSection==='rules'?rules():audit()}`}
function render(){let app=document.getElementById('app');app.innerHTML=nav()+`<main class="app" id="page-content">`+top()+banner()+(state.tab==='home'?home():state.tab==='personal'?personal():state.tab==='group'?group():state.tab==='matrix'?matrix():state.tab==='more'?more():admin())+`<footer class="footer">微波 · V1.5 月休試用版<br>本頁不連線到 TrueNAS；正式帳號權限、Excel 匯入與資料同步需待 Codex 開發。</footer></main>`+(state.loginOpen?loginModal():'');persist()}
function changeMonth(delta){let dt=new Date(state.year,state.month-1+delta,1);state.year=dt.getFullYear();state.month=dt.getMonth()+1;state.day=Math.min(state.day,days(state.year,state.month));render()}
function parseDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(new Date(s+'T12:00:00').getTime())?new Date(s+'T12:00:00'):null}
function error(msg){alert(msg)}
function log(action,detail){data.audits.push({action,detail,time:new Date().toLocaleString('zh-TW')});if(data.audits.length>150)data.audits=data.audits.slice(-150)}
function batchRecords(){const from=parseDate(state.from),to=parseDate(state.to);if(!from||!to||from>to)throw Error('請輸入正確的起訖日期');let diff=Math.round((to-from)/86400000)+1;if(diff>366)throw Error('一次最多選擇 366 天');if(!state.chosen.size)throw Error('請至少選擇一位人員');let arr=[];for(let t=new Date(from);t<=to;t.setDate(t.getDate()+1)){let dt=dateStr(t.getFullYear(),t.getMonth()+1,t.getDate());for(const i of state.chosen)arr.push({key:`${dt}|${i}`,person:i,date:dt,prev:code(i,dt),next:state.batchStatus})}return arr}
function adjustBalance(){let val=Number(document.getElementById('balance-target').value),reason=document.getElementById('balance-reason').value.trim();if(document.getElementById('balance-target').value.trim()===''||!Number.isFinite(val)||val<0)return error('請輸入有效且不得小於 0 的剩餘天數');if(!reason)return error('請填寫修正原因');let i=state.balancePerson,t=state.balanceType,a=acct(i),before=balance(i,t);a.adjust[t]=+(a.adjust[t]+val-before).toFixed(2);log('手動修正餘額',`${PEOPLE[i]}・${t}：${fmt(before)} → ${fmt(val)} 天。原因：${reason}`);state.balanceTarget='';state.balanceReason='';persist();render();error('已在本機示範資料中完成修正。')}
function saveBaseline(){const reason=document.getElementById('baseline-reason').value.trim();if(!reason)return error('請填寫修改原因');const i=state.balancePerson,a=acct(i);let parts=[];for(const t of TYPES){const b=Number(document.getElementById('base-'+t).value),n=Number(document.getElementById('added-'+t).value);if(!Number.isFinite(b)||!Number.isFinite(n)||b<0||n<0)return error('額度只能輸入有效、非負的數字');parts.push(`${t} 起始${fmt(a.base[t])}→${fmt(b)}、新增${fmt(a.added[t])}→${fmt(n)}`);a.base[t]=b;a.added[t]=n}log('更新額度設定',`${PEOPLE[i]}：${parts.join('；')}。原因：${reason}`);persist();render();error('額度設定已更新。')}
function saveRule(s){const target=document.querySelector(`[data-rule-target="${s}"]`).value,unit=Number(document.querySelector(`[data-rule-unit="${s}"]`).value);if(!Number.isFinite(unit)||unit<0||unit>31)return error('扣除天數須在 0～31 之間');data.rules[s]={target,unit};log('設定扣假規則',`${s}：${target||'不扣／待定'}，每次 ${unit} 天`);persist();render();error('示範扣假規則已更新，餘額已重新計算。')}
document.getElementById('app').addEventListener('click',function(ev){const el=ev.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,v=el.dataset.val;try{if(a==='login'){state.loginOpen=true;state.loginError='';render()}else if(a==='close-login'){state.loginOpen=false;render()}else if(a==='logout'){state.admin=false;state.menuOpen=false;state.tab='home';history.replaceState(null,'','#home');render()}else if(a==='menu-toggle'){state.menuOpen=!state.menuOpen;render()}else if(a==='menu-close'){state.menuOpen=false;render()}else if(a==='tab'){ev.preventDefault();if(v==='admin'&&!state.admin){state.menuOpen=false;state.loginOpen=true;render()}else{state.tab=v;state.menuOpen=false;history.pushState(null,'','#'+v);window.scrollTo({top:0,behavior:'instant'});render()}}else if(a==='prev')changeMonth(-1);else if(a==='next')changeMonth(1);else if(a==='day'){state.day=Number(v);render();if(state.tab==='group'&&window.innerWidth<951)document.getElementById('day-info')?.scrollIntoView({behavior:'smooth',block:'nearest'})}else if(a==='matrix-end'){let s=document.getElementById('matrix-scroller');s.scrollLeft=s.scrollWidth}else if(a==='matrix-start'){document.getElementById('matrix-scroller').scrollLeft=0}else if(a==='admin-section'){state.adminSection=v;state.review=false;render()}else if(a==='select-all'){state.chosen=new Set(PEOPLE.map((_,i)=>i));state.review=false;render()}else if(a==='select-none'){state.chosen=new Set();state.review=false;render()}else if(a==='picker-toggle'){if(state.pickerOpen===v){state.pickerOpen=null}else{state.pickerOpen=v;const [y,m]=state[v].split('-').map(Number);state.pickerYear=y;state.pickerMonth=m}render()}
else if(a==='picker-close'){state.pickerOpen=null;render()}
else if(a==='picker-nav'){const dt=new Date(state.pickerYear,state.pickerMonth-1+Number(v),1);state.pickerYear=dt.getFullYear();state.pickerMonth=dt.getMonth()+1;render()}
else if(a==='picker-today'){const dt=new Date();state.pickerYear=dt.getFullYear();state.pickerMonth=dt.getMonth()+1;render()}
else if(a==='picker-day'){if(!state.pickerOpen)return;state[state.pickerOpen]=v;state.pickerOpen=null;state.review=false;state.reviewRecords=null;render()}
else if(a==='quick-range'){let dt=new Date(state.year,state.month-1+(v==='next'?1:0),1),y=dt.getFullYear(),m=dt.getMonth()+1;state.from=dateStr(y,m,1);state.to=dateStr(y,m,days(y,m));state.pickerOpen=null;state.review=false;render()}else if(a==='batch-preview'){state.reviewRecords=batchRecords();state.review=true;render()}else if(a==='batch-cancel'){state.review=false;render()}else if(a==='batch-apply'){if(!state.reviewRecords)return;let rec=state.reviewRecords.filter(x=>x.prev!==x.next);if(!rec.length)return;for(const r of rec)data.overrides[r.key]=r.next;log('批次設定',`${state.chosen.size} 人，${state.from} ～ ${state.to}，設定「${state.batchStatus||'清除'}」，共 ${rec.length} 筆`);state.review=false;state.reviewRecords=null;persist();render();error(`已在試用資料中套用 ${rec.length} 筆修改。`)}else if(a==='balance-correct')adjustBalance();else if(a==='save-baseline')saveBaseline();else if(a==='rule-save')saveRule(v);else if(a==='reset-demo'){if(confirm('確定要清除所有示範修改、重設餘額與扣假規則？')){data={overrides:{},rules:{},accounts:{},audits:[]};state.review=false;persist();render()}}}catch(err){error(err.message)}});
document.getElementById('app').addEventListener('change',function(ev){const x=ev.target,n=x.dataset.change;if(x.hasAttribute('data-member')){const i=Number(x.dataset.member);if(x.checked)state.chosen.add(i);else state.chosen.delete(i);state.review=false;render();return}if(!n)return;if(n==='person'){state.person=x.value===''?null:Number(x.value)}else if(n==='from'){state.from=x.value;state.review=false}else if(n==='to'){state.to=x.value;state.review=false}else if(n==='batch-status'){state.batchStatus=x.value;state.review=false}else if(n==='balance-person'){state.balancePerson=Number(x.value);state.balanceTarget='';state.balanceReason=''}else if(n==='balance-type'){state.balanceType=x.value;state.balanceTarget='';state.balanceReason=''}render()});
document.getElementById('app').addEventListener('input',function(ev){const x=ev.target;if(x.id==='name-search'){state.memberSearch=x.value;for(const node of document.querySelectorAll('[data-name]'))node.style.display=node.dataset.name.includes(x.value)?'flex':'none'}if(x.id==='balance-target')state.balanceTarget=x.value;if(x.id==='balance-reason')state.balanceReason=x.value});
document.addEventListener('click',function(ev){if(!state.pickerOpen)return;if(ev.target.closest('.date-popover,.date-trigger,.date-picker-shade'))return;state.pickerOpen=null;render()});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'){if(state.pickerOpen)state.pickerOpen=null;else if(state.menuOpen)state.menuOpen=false;else if(state.loginOpen)state.loginOpen=false;render()}});
window.addEventListener('popstate',function(){const route=location.hash.slice(1);state.tab=routeOk(route)?route:'home';state.menuOpen=false;render()});
window.addEventListener('hashchange',function(){const route=location.hash.slice(1);if(routeOk(route)&&state.tab!==route){state.tab=route;state.menuOpen=false;render()}});
document.getElementById('app').addEventListener('submit',function(ev){if(ev.target.id!=='login-form')return;ev.preventDefault();let fd=new FormData(ev.target);if(fd.get('loginUser')==='admin'&&fd.get('loginPass')==='demo2026'){state.admin=true;state.loginOpen=false;state.menuOpen=false;state.tab='admin';state.adminSection='batch';history.pushState(null,'','#admin');render()}else{state.loginError='示範帳號或密碼錯誤';render()}});
render();
})();
</script>
</body>
</html>
